<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="body" x1="32" y1="4" x2="32" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="dome" x1="32" y1="4" x2="32" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef9e0"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Finial sphere + spire -->
  <circle cx="32" cy="5" r="2" fill="#fde68a"/>
  <line x1="32" y1="7" x2="32" y2="13" stroke="#fde68a" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Dome -->
  <path d="M17 30 Q17 13 32 13 Q47 13 47 30Z" fill="url(#dome)"/>
  <!-- Dome shine -->
  <path d="M23 28 Q25 17 32 14" stroke="rgba(255,255,255,0.35)" stroke-width="1.1" stroke-linecap="round" fill="none"/>

  <!-- Collar band under dome -->
  <rect x="17" y="29" width="30" height="3" rx="1.5" fill="#92400e"/>

  <!-- Body (slightly tapered) -->
  <path d="M19 32 L17 54 L47 54 L45 32Z" fill="url(#body)"/>

  <!-- Three arched openings -->
  <path d="M22 54 L22 44 Q22 40 25 40 Q28 40 28 44 L28 54Z" fill="rgba(10,4,20,0.65)"/>
  <path d="M29 54 L29 42 Q29 38 32 38 Q35 38 35 42 L35 54Z" fill="rgba(10,4,20,0.65)"/>
  <path d="M36 54 L36 44 Q36 40 39 40 Q42 40 42 44 L42 54Z" fill="rgba(10,4,20,0.65)"/>

  <!-- Mid-body decorative band -->
  <rect x="17" y="46" width="30" height="1.5" rx="0.75" fill="rgba(146,64,14,0.5)"/>

  <!-- Base steps -->
  <rect x="15" y="54" width="34" height="3" rx="1" fill="#92400e"/>
  <rect x="11" y="57" width="42" height="3.5" rx="1" fill="#78350f"/>
</svg>
